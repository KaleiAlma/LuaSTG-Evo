# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: true

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-13]
        build_type: [Release]
        # build_type: [Release, RelWithDebInfo, Debug]
        target_arch:
          - main: x86_64
            main_win: AMD64
            rev: westmere
            rev_win: SSE4.2
          - main: x86_64
            main_win: AMD64
            rev: haswell
            rev_win: AVX2
          - main: arm64
            main_win: ARM64
            rev: armv8.2-a
            rev_win: armv8.2
        exclude:
          - os: macos-14
            target_arch:
              rev_win: AVX2
        # c_compiler: [gcc, clang, cl]
        # c_compiler: [clang, MSVC]
        # include:
          # - os: windows-latest
          #   c_compiler: MSVC
          #   cpp_compiler: MSVC
          # - os: ubuntu-latest
          #   c_compiler: gcc
          #   cpp_compiler: g++
          # - os: ubuntu-latest
          #   c_compiler: clang
          #   cpp_compiler: clang++
        # exclude:
          # - os: windows-latest
          #   c_compiler: gcc
          # - os: windows-latest
          #   c_compiler: clang
          # - os: ubuntu-latest
          #   c_compiler: MSVC

    steps:
    - run: echo ${{ runner.os }}

    - if: ${{ runner.os == 'Linux' }}
      run: sudo apt update && sudo apt install ninja-build mesa-utils mesa-common-dev libxext-dev libasound2-dev libsdl2-dev && sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
    - if: ${{ runner.os == 'Windows' }}
      run: choco install ninja
    - if: ${{ runner.os == 'macOS' }}
      run: brew install ninja llvm@18 dylibbundler

    # - if: ${{ runner.os == 'Windows' }}
    
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Cache C++ packages
      id: cache-cpp
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/cpm-cache
        key: ${{ runner.os }}-cpm-${{ hashFiles('**/') }}
        restore-keys: |
          ${{ runner.os }}-cpm-

    - name: Set Windows VCVars
      if: ${{ runner.os == 'Windows' }}
      run: |
        (vcvars ${{ matrix.target_arch.main_win }}).GetEnumerator()
        | Foreach { "$($_.Key)=$($_.Value)" >> "$env:GITHUB_ENV" }
      
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
    - name: Configure CMake (Use Shared Libs)
      run: >
        cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchain/${{ runner.os }}-${{ matrix.target_arch.main }}${{ env.LSTGEXT_MSVC }}.cmake
        -DCMAKE_BUILD_TYPE=Release
        -DTARGET_ARCH_REV="${{ matrix.target_arch.rev }}"
        -DTARGET_ARCH_REV_WIN="${{ matrix.target_arch.rev_win }}"
        -DLSTGEXT_REPO=KaleiAlma/LSTG-Evo-External
        -DLSTGEXT_LIB
        -DLSTG_EXTERNAL_INSTALL_SUBDIR=shared/lstgext
        -DLSTGEXT_BUILD=${{ inputs.build }}
        -DCPM_SOURCE_CACHE=${{ github.workspace }}/build/cpm-cache
        ${{ inputs.sdl3 && '-DLSTGEXT_SDL3_DIR=SDL3-shared' || '' }}
        -G Ninja

    - name: Build With CMake (Use Shared Libs)
      run: >
        cmake --build ${{ github.workspace }}/build --config Release --target external-build
        &&
        cmake --install ${{ github.workspace }}/build

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bin-${{ runner.os }}-${{ matrix.build_type }}
        path: |
          build/bin
        retention-days: 7
